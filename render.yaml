services:
  # ── Backend Web Service ──────────────────────────────────────────────────────
  - type: web
    name: creditlens-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000           # Render internal port (Render routes external 443 → 10000)
      - key: MONGODB_URI
        sync: false            # Set manually in Render dashboard — your Atlas URI
      - key: JWT_SECRET
        generateValue: true    # Render auto-generates a secure random value
      - key: CLIENT_URL
        sync: false            # Set manually after frontend is deployed, e.g. https://creditlens-frontend.onrender.com

  # ── Frontend Static Site ─────────────────────────────────────────────────────
  - type: web
    name: creditlens-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false            # Set manually after backend is deployed, e.g. https://creditlens-api.onrender.com/api
